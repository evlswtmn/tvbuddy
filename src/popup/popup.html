<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TVBuddy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📺 TVBuddy</h1>
      <p class="tagline">Your TV show companion</p>
    </header>

    <main>
      <div class="search-section">
        <input
          type="text"
          id="searchInput"
          placeholder="Search for a TV show..."
          autocomplete="off"
        >
        <button id="searchBtn">Search</button>
      </div>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Searching...</p>
      </div>

      <div id="results" class="results hidden">
        <div id="showInfo" class="show-info"></div>
      </div>

      <div id="error" class="error hidden">
        <p id="errorMessage"></p>
      </div>

      <div id="welcome" class="welcome">
        <p>Search for any TV show to get information, ratings, and recommendations!</p>
      </div>
    </main>

    <footer>
      <p class="version">v1.0.0</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
