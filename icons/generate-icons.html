<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Buddy Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ccc;
      margin: 10px;
    }
    .instructions {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>TV Buddy Icon Generator</h1>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Open this HTML file in your browser</li>
      <li>Right-click on each icon below</li>
      <li>Select "Save image as..."</li>
      <li>Save as icon16.png, icon48.png, and icon128.png respectively</li>
    </ol>
  </div>

  <div>
    <h3>16x16 Icon:</h3>
    <canvas id="icon16" width="16" height="16"></canvas>
  </div>

  <div>
    <h3>48x48 Icon:</h3>
    <canvas id="icon48" width="48" height="48"></canvas>
  </div>

  <div>
    <h3>128x128 Icon:</h3>
    <canvas id="icon128" width="128" height="128"></canvas>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const scale = size / 128;

      // Background circle
      ctx.fillStyle = '#667eea';
      ctx.beginPath();
      ctx.arc(size/2, size/2, size * 0.47, 0, Math.PI * 2);
      ctx.fill();

      // TV Screen outline
      ctx.fillStyle = '#fff';
      ctx.fillRect(25 * scale, 35 * scale, 78 * scale, 55 * scale);

      // TV Screen inner
      ctx.fillStyle = '#764ba2';
      ctx.fillRect(30 * scale, 40 * scale, 68 * scale, 45 * scale);

      // Play icon
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(55 * scale, 55 * scale);
      ctx.lineTo(55 * scale, 70 * scale);
      ctx.lineTo(70 * scale, 62.5 * scale);
      ctx.closePath();
      ctx.fill();

      // TV stand
      ctx.fillStyle = '#fff';
      ctx.fillRect(55 * scale, 90 * scale, 18 * scale, 5 * scale);
      ctx.fillRect(40 * scale, 95 * scale, 48 * scale, 3 * scale);

      // Antenna
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.moveTo(50 * scale, 35 * scale);
      ctx.lineTo(40 * scale, 20 * scale);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(78 * scale, 35 * scale);
      ctx.lineTo(88 * scale, 20 * scale);
      ctx.stroke();

      // Antenna tips
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(40 * scale, 20 * scale, 3 * scale, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(88 * scale, 20 * scale, 3 * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // Generate all icons
    drawIcon(document.getElementById('icon16'), 16);
    drawIcon(document.getElementById('icon48'), 48);
    drawIcon(document.getElementById('icon128'), 128);
  </script>
</body>
</html>
